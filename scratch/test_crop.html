<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Crop Top Header</title>
    <style>
        body { background: #0c0814; color: #fff; font-family: sans-serif; padding: 30px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        
        /* Standard / Current */
        .card-original {
            width: 330px;
            height: 500px;
            border-radius: 18px;
            overflow: hidden;
            background: #150c2a;
            border: 1px solid rgba(201, 168, 76, 0.3);
        }
        .card-original iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Option 1: Top cropped by 54px */
        .card-cropped {
            width: 330px;
            height: 480px;
            border-radius: 18px;
            overflow: hidden;
            background: #150c2a;
            border: 1px solid rgba(201, 168, 76, 0.3);
            position: relative;
        }
        .card-cropped iframe {
            position: absolute;
            top: -56px;
            left: 0;
            width: 100%;
            height: calc(100% + 56px);
            border: none;
        }

        /* Option 2: Luxury Top Overlay */
        .card-overlayed {
            width: 330px;
            height: 510px;
            border-radius: 18px;
            overflow: hidden;
            background: #150c2a;
            border: 1px solid rgba(201, 168, 76, 0.3);
            position: relative;
        }
        .card-overlayed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .custom-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(180deg, rgba(14, 6, 28, 0.98) 0%, rgba(14, 6, 28, 0.85) 75%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            z-index: 5;
            pointer-events: none; /* Let clicks go through, or keep top clean */
        }
        .custom-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .custom-brand img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #C9A84C;
        }
        .custom-brand-text {
            font-size: 0.8rem;
            font-weight: 700;
            color: #C9A84C;
        }
        .custom-badge {
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(201, 168, 76, 0.2);
            border: 1px solid rgba(201, 168, 76, 0.4);
            color: #f3de9f;
            padding: 3px 10px;
            border-radius: 999px;
        }

        /* Option 3: Elegant header with custom 'Watch Reel' button overlaying 'View Profile' */
        .card-pill-overlay {
            width: 330px;
            height: 510px;
            border-radius: 18px;
            overflow: hidden;
            background: #150c2a;
            border: 1px solid rgba(201, 168, 76, 0.3);
            position: relative;
        }
        .card-pill-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .top-luxury-mask {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: #140b28;
            border-bottom: 1px solid rgba(201, 168, 76, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 10;
        }
        .reiki-mini-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #ffffff;
        }
        .reiki-mini-pill img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #C9A84C;
        }
        .btn-watch-gold {
            background: linear-gradient(135deg, #C9A84C 0%, #e2c87b 100%);
            color: #110724;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 999px;
            box-shadow: 0 2px 8px rgba(201, 168, 76, 0.3);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div>
        <h3>1. Original (White bar + blue button)</h3>
        <div class="card-original">
            <iframe src="https://www.instagram.com/reel/C7nY4MESYo7/embed/"></iframe>
        </div>
    </div>
    <div>
        <h3>2. Cropped (Top 56px hidden - Pure Video)</h3>
        <div class="card-cropped">
            <iframe src="https://www.instagram.com/reel/C7nY4MESYo7/embed/"></iframe>
        </div>
    </div>
    <div>
        <h3>3. Luxury Mask (Covers white bar with Gold Reiki Bliss header)</h3>
        <div class="card-pill-overlay">
            <div class="top-luxury-mask">
                <div class="reiki-mini-pill">
                    <img src="assets/images/reikilogo1.png" alt="Reiki Bliss">
                    <span>reiki_bliss</span>
                </div>
                <span class="btn-watch-gold">▶ Sacred Mudra</span>
            </div>
            <iframe src="https://www.instagram.com/reel/C7nY4MESYo7/embed/"></iframe>
        </div>
    </div>
</body>
</html>
