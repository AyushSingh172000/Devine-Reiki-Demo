<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; background: #0e051d; font-family: sans-serif; }
  .modal-wrapper {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10,5,20,0.95);
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    height: 54px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #15092a;
    border-bottom: 1px solid rgba(201,168,76,0.3);
    color: #ffffff;
  }
  .modal-title { font-size: 15px; font-weight: 600; color: #C9A84C; }
  .close-btn {
    background: #251240;
    border: 1px solid #C9A84C;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .iframe-container {
    flex: 1;
    width: 100%;
    height: calc(100% - 54px);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }
</style>
</head>
<body>
  <div class="modal-wrapper">
    <div class="modal-header">
      <div class="modal-title">🗓️ Book Free Consultation</div>
      <button class="close-btn">✕ Close</button>
    </div>
    <div class="iframe-container">
      <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1RI6bVu-iU0Oi4_H09OlL-bQglgmpskaOrSO0nCevRuaKlWfCVYv1XsrEzLz-g7HUkgeiO0C2c"></iframe>
    </div>
  </div>
</body>
</html>
